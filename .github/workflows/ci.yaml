name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      # Before generating, so this only judges code a human wrote. Generated
      # files are gitignored and the generator's formatter does not always agree
      # with `dart format` to the character.
      - name: Format
        run: dart format --set-exit-if-changed .

      # The example's shims and ABI fingerprint are generated and gitignored, so
      # a fresh checkout does not have them and everything downstream — analyze,
      # the example's tests — fails without this step.
      - name: Generate
        run: dart run build_runner build
        working-directory: example/json_drift_app

      - name: Analyze
        run: flutter analyze

      # Pure-Dart packages run under `dart test`. marineford_gen has to: build_test
      # drives build_runner, which needs the Dart VM's own package resolution
      # and cannot write assets inside the Flutter test harness.
      - name: Test (Dart packages)
        run: dart test packages/marineford_core packages/marineford_gen packages/marineford_cli

      - name: Test (Flutter runtime)
        run: flutter test packages/marineford example/json_drift_app

  # The design rests on a handful of specific costs, so they are measured
  # rather than remembered. Budgets are loose enough to tolerate a slow runner
  # and tight enough to catch an order-of-magnitude regression.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # AOT, not JIT: the JIT numbers describe nothing that ships, and the
      # benchmark refuses to check budgets under it.
      - run: dart compile exe bench/bin/run.dart -o bench/run
      - run: ./bench/run --check
