include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Public API documentation is required here. It carries pub.dev score, but
    # mostly it is how anyone reading this library finds out why a rule exists.
    public_member_api_docs: warning
    # A swallowed exception in the patch pipeline is a patch that silently does
    # nothing, on a device nobody can attach a debugger to. Every catch in this
    # repository has to say what it is catching and why.
    empty_catches: error
    unawaited_futures: error
  exclude:
    - "**/*.g.dart"
    - "**/*.marineford.dart"
    - "**/*.eval.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - sort_pub_dependencies
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters
