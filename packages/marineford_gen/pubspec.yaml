name: marineford_gen
description: >-
  build_runner code generator for marineford. Turns @patchable and
  @PatchableService into zero-overhead dispatch shims, and computes the ABI
  fingerprint that keeps patches from being applied to the wrong build.
version: 0.1.0-dev
repository: https://github.com/yusufkecer/marineford/tree/main/packages/marineford_gen
issue_tracker: https://github.com/yusufkecer/marineford/issues
topics:
  - code-push
  - codegen
  - build-runner

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  analyzer: ^8.2.0
  build: ^4.0.0
  crypto: ^3.0.6
  dart_style: ^3.1.0
  glob: ^2.1.0
  logging: ^1.3.0
  marineford_annotation: ^0.1.0-dev
  path: ^1.9.0
  pub_semver: ^2.1.5
  source_gen: ^4.2.4

dev_dependencies:
  # build_runner >=2.15.2 analyzer >=13'e geciyor; dart_eval 0.8.5 analyzer
  # ^8.2.0'da. Kullanicinin uygulamasi ikisini birden cekecegi icin ust sinir
  # burada da bilerek 2.15.x. Detay: plan.md §13.
  build_runner: ">=2.15.0 <2.15.2"
  build_test: ^3.5.0
  lints: ^6.0.0
  test: ^1.25.0
