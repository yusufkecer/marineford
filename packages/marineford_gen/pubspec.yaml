name: marineford_gen
description: >-
  build_runner code generator for marineford. Turns @patchable and
  @PatchableService into zero-overhead dispatch shims, and computes the ABI
  fingerprint that keeps patches from being applied to the wrong build.
version: 0.1.0-dev
repository: https://github.com/yusufkecer/marineford/tree/main/packages/marineford_gen
issue_tracker: https://github.com/yusufkecer/marineford/issues
topics:
  - code-push
  - codegen
  - build-runner

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  analyzer: ^8.2.0
  build: ^4.0.0
  crypto: ^3.0.6
  dart_style: ^3.1.0
  glob: ^2.1.0
  logging: ^1.3.0
  path: ^1.9.0
  pub_semver: ^2.1.5
  source_gen: ^4.2.4

dev_dependencies:
  # Deliberately capped. build_runner >=2.15.2 moves to analyzer >=13, while
  # dart_eval 0.8.5 pins analyzer ^8.2.0 — and an application depends on both,
  # so the ceiling is the user's problem as much as ours. It resolves today.
  # The way out, if it stops resolving: this package does not depend on
  # dart_eval at all, so its analyzer constraint can be separated.
  build_runner: ">=2.15.0 <2.15.2"
  build_test: ^3.5.0
  lints: ^6.0.0
  test: ^1.25.0
