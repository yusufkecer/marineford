name: marineford_annotation
description: >-
  Annotations for marineford, the Flutter code-push library. Zero
  dependencies, safe to depend on from both your app and your patch package.
version: 0.1.0-dev
repository: https://github.com/yusufkecer/marineford/tree/main/packages/marineford_annotation
issue_tracker: https://github.com/yusufkecer/marineford/issues
topics:
  - code-push
  - annotations
  - codegen

environment:
  sdk: ^3.6.0

resolution: workspace

# Bilerek hicbir `dependencies` yok — bu paket hem uygulamanin hem patch
# paketinin bagimlisi olacak, ikisine de hicbir sey bulastirmamali.
dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
