name: marineford_annotation
description: >-
  Annotations for marineford, the Flutter code-push library. Zero
  dependencies, safe to depend on from both your app and your patch package.
version: 0.1.0-dev
repository: https://github.com/yusufkecer/marineford/tree/main/packages/marineford_annotation
issue_tracker: https://github.com/yusufkecer/marineford/issues
topics:
  - code-push
  - annotations
  - codegen

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  meta: ^1.15.0

# Only `meta`, for the @Target annotation. The point of this package is that an
# application and a patch package can both depend on it without pulling in a
# runtime or a generator.
dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
